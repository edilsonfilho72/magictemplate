name: Build MAGICtemplate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: magictemplate-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Exigir lockfile versionado sem recalcular dependências
        id: prepare
        run: |
          set -euo pipefail
          node --version
          npm --version
          if [ ! -f package-lock.json ] || ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo '::error::package-lock.json ausente do commit. Sincronize-o com npm install na raiz, valide com npm ci e npm run build e inclua-o no commit. Este workflow não gera nem altera o lockfile.'
            exit 1
          fi
          echo 'Lockfile versionado encontrado; a instalação utilizará somente npm ci.'

      - name: Instalar exclusivamente pelo lockfile
        id: install
        run: |
          set -euo pipefail
          npm ci --strict-peer-deps 2>&1 | tee install.log
          git diff --exit-code -- package.json package-lock.json src

      - name: Registrar resoluções Supabase instaladas
        id: supabase
        run: |
          set -euo pipefail
          npm ls @supabase/supabase-js @supabase/auth-js @supabase/functions-js @supabase/postgrest-js @supabase/realtime-js @supabase/storage-js --all 2>&1 | tee supabase-versions.log

      - name: Registrar resoluções TanStack e verificar exports
        id: dependencies
        run: |
          set -euo pipefail
          npm ls @tanstack/react-router @tanstack/router-plugin @tanstack/router-generator @tanstack/router-core @tanstack/router-utils --all 2>&1 | tee tanstack-versions.log
          node --input-type=module <<'NODE' 2>&1 | tee tanstack-exports.log
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const [path, entry] of Object.entries(lock.packages)) {
            if (path.includes('node_modules/@tanstack/')) {
              console.log(JSON.stringify({ path, version: entry.version, dependencies: entry.dependencies, peerDependencies: entry.peerDependencies }));
            }
          }
          const generator = await import('@tanstack/router-generator');
          console.log('Exports do generator instalado:', Object.keys(generator).sort());
          if (typeof generator.generator !== 'function') {
            throw new Error('O generator instalado não exporta a função generator exigida pelo plugin.');
          }
          const plugin = await import('@tanstack/router-plugin/vite');
          console.log('Exports do plugin Vite:', Object.keys(plugin).sort());
          if (typeof plugin.TanStackRouterVite !== 'function') {
            throw new Error('A API TanStackRouterVite utilizada pelo projeto não está disponível.');
          }
          NODE

      - name: Verificar carregamento de vite.config.ts
        id: config
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee vite-config.log
          import { loadConfigFromFile } from 'vite';
          const config = await loadConfigFromFile({ command: 'build', mode: 'production' });
          if (!config) throw new Error('Configuração Vite não carregada.');
          console.log('Configuração carregada:', config.path);
          NODE

      - name: Gerar rotas e compilar com Vite
        id: vite
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch src/routeTree.gen.ts >/dev/null 2>&1; then
            echo '::error::A árvore gerada não deve ser versionada por este workflow.'
            exit 1
          fi
          test ! -e src/routeTree.gen.ts
          npm exec -- vite build 2>&1 | tee vite-build.log

      - name: Confirmar geração automática das três rotas
        id: routes
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee routes.log
          import { readFileSync } from 'node:fs';
          const tree = readFileSync('src/routeTree.gen.ts', 'utf8');
          if (!tree.trim()) throw new Error('Árvore gerada vazia.');
          for (const route of ['/', '/templates', '/configuracoes']) {
            if (!tree.includes(`'${route}'`) && !tree.includes(JSON.stringify(route))) {
              throw new Error(`Rota não encontrada na árvore gerada: ${route}`);
            }
          }
          console.log('Árvore gerada pelo plugin contém /, /templates e /configuracoes.');
          NODE

      - name: Verificar TypeScript
        id: types
        run: |
          set -euo pipefail
          npm exec -- tsc --noEmit 2>&1 | tee typescript.log

      - name: Executar script completo de build
        id: build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee build.log

      - name: Confirmar preservação do manifesto e do lockfile
        id: unchanged
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json

      - name: Disponibilizar diagnósticos e resolução
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            *.log
            tanstack-metadata.json
            package.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 14

      - name: Registrar resultados reais
        if: ${{ always() }}
        env:
          PREPARE_RESULT: ${{ steps.prepare.outcome }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          SUPABASE_RESULT: ${{ steps.supabase.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          CONFIG_RESULT: ${{ steps.config.outcome }}
          VITE_RESULT: ${{ steps.vite.outcome }}
          ROUTES_RESULT: ${{ steps.routes.outcome }}
          TYPES_RESULT: ${{ steps.types.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          UNCHANGED_RESULT: ${{ steps.unchanged.outcome }}
        run: |
          {
            echo '## MAGICtemplate — resultados'
            echo "- Presença do lockfile versionado: ${PREPARE_RESULT}"
            echo "- npm ci: ${INSTALL_RESULT}"
            echo "- Resoluções Supabase: ${SUPABASE_RESULT}"
            echo "- Dependências TanStack e exports: ${DEPENDENCIES_RESULT}"
            echo "- Carregamento da configuração Vite: ${CONFIG_RESULT}"
            echo "- Compilação Vite: ${VITE_RESULT}"
            echo "- Geração automática e presença das três rotas: ${ROUTES_RESULT}"
            echo "- TypeScript: ${TYPES_RESULT}"
            echo "- npm run build: ${BUILD_RESULT}"
            echo "- Manifesto e lockfile preservados: ${UNCHANGED_RESULT}"
            echo '- Etapas com resultado skipped não foram executadas e não representam validação.'
            echo '- npm install não é executado por este workflow; a sincronização do lockfile deve anteceder o commit.'
            echo '- Este workflow não cria commits nem envia alterações ao GitHub.'
            echo '- Os logs produzidos estão no artefato build-diagnostics.'
            echo '- A árvore de rotas é gerada pelo plugin; não é criada manualmente nem publicada pelo workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
